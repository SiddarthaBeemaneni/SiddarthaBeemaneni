<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#050816"/>
  </linearGradient>
  <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F7FF">
      <animate attributeName="stop-color" values="#00F7FF;#7C3AED;#FF0080;#00F7FF" dur="10s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#FF0080">
      <animate attributeName="stop-color" values="#FF0080;#00F7FF;#7C3AED;#FF0080" dur="10s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
</defs>

<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<rect x="5" y="5" width="1190" height="290" rx="25" fill="none" stroke="url(#neon)" stroke-width="5"/>

<g fill="none" stroke="url(#neon)" opacity="0.35">
  <circle cx="120" cy="70" r="42">
    <animate attributeName="r" values="30;65;30" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="230" r="58">
    <animate attributeName="r" values="45;85;45" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="6s" repeatCount="indefinite"/>
  </circle>
</g>

<g fill="#FFFFFF">
  <circle cx="80" cy="55" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="65" r="3"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="990" cy="245" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="245" r="3"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
</g>

<text x="600" y="125" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58" font-weight="700" fill="#FFFFFF">SIDDARTHA</text>

<text x="600" y="170" text-anchor="middle"
      font-family="monospace"
      font-size="23" font-weight="600" fill="url(#neon)">FULL-STACK DEVELOPER • AI/ML ENTHUSIAST</text>

<text x="600" y="215" text-anchor="middle"
      font-family="monospace"
      font-size="17" fill="#94A3B8">BUILDING IDEAS INTO WORKING SOFTWARE</text>
</svg>
